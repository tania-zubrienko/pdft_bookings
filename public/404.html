<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pole Dance Fit Talavera</title>
    <script>
      // Single Page App redirect for GitHub Pages.
      // Encodes the path into a query string so the browser is redirected
      // to index.html, which then restores the original path via history.replaceState.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // 1 for project pages (e.g. /pdft_bookings/)

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
